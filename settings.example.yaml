# Pi Dashboard settings
# Most of these can be changed on the touchscreen (gear button). If you edit
# this file by hand, restart afterwards with:
#   sudo systemctl restart pi-dashboard

# Web address port. The screen opens http://localhost:8090
port: 8090

# Your location (the Weather Service uses 4 decimal places).
location:
  name: Corryton
  latitude: 36.0887
  longitude: -83.8194

# 12h or 24h
clock: 12h

# Settings can only be changed on the touchscreen. Set to true to also allow
# changing them from other computers on your network.
allow_settings_from_network: false

# Pages rotate in this order; each shows for `seconds`.
pages:
  resume_after_touch_seconds: 120
  list:
    - name: weather
      enabled: true
      seconds: 60
    - name: flights
      enabled: true
      seconds: 30
    - name: backyard
      enabled: true
      seconds: 45

weather:
  # How often to fetch forecasts, current conditions and alerts.
  refresh_minutes: 5
  show_radar: true
  show_hourly: true
  show_daily: true
  show_forecast_text: true
  # How far back the radar loop goes (30 to 120 minutes).
  radar_loop_minutes: 60
  # 8 = whole region, 10 = close up
  radar_zoom: 8

flights:
  # The plane feed your mini PC already publishes (read only).
  feed_url: http://192.168.1.76:8080/data/aircraft.json
  range_miles: 50
  list_count: 6
  # Hide planes above this height; 0 shows all.
  max_altitude_ft: 0
  show_labels: true
  # Look up airline routes (e.g. Atlanta to Chicago) from adsbdb.com.
  route_lookup: true

backyard:
  # The last-hour timelapse from the timelapse server on the mini PC.
  timelapse:
    url: http://192.168.1.76:8177/live/Backyard/last_hour.mp4
    user: dashboard
    pin: ""           # type the dashboard account's PIN between the quotes
  # The live picture, from the recorder's copy of the Backyard camera
  # (not the camera itself: two pulls from the camera damage the recording).
  live:
    url: rtsp://192.168.1.176:554/h264Preview_03_sub
    user: ""          # the recorder's user name, between the quotes
    password: ""      # the recorder's password, between the quotes

screen:
  # Darken the screen between these times (this monitor has no brightness
  # control the Pi can use, so the picture itself is darkened).
  night_dim: false
  night_start: "22:00"
  night_end: "06:30"
  night_brightness: 40

# Map background (Esri, free, no account). Labels are drawn on top.
map:
  base_tiles: https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}
  label_tiles: https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}
